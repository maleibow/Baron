name: Build Genesis ROM

on:
  push:
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Compile with SGDK (official Docker image)
        run: |
          docker run --rm -v "$PWD":/src -w /src -u "$(id -u):$(id -g)" -t ghcr.io/stephane-d/sgdk:latest
      - name: Confirm ROM exists
        run: |
          ls -l out/
          test -f out/rom.bin
          echo "ROM size: $(stat -c %s out/rom.bin) bytes"

      - name: Save ROM as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: baron-munchausen-rom
          path: |
            out/rom.bin
            out/symbol.txt
          if-no-files-found: error
